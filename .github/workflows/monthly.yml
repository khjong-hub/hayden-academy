name: HAYDEN ACADEMY · Monthly

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 1 * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

concurrency:
  group: hayden-academy-monthly
  cancel-in-progress: false

jobs:
  update-monthly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Monthly review
        run: python scripts/generate_issue.py monthly

      - name: Commit Monthly update
        run: |
          git config user.name "hayden-academy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monthly automation/status.json
          git diff --cached --quiet || git commit -m "auto: update monthly review"
          git push
