name: HAYDEN ACADEMY · Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

concurrency:
  group: hayden-academy-daily
  cancel-in-progress: false

jobs:
  update-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Daily issue
        run: python scripts/generate_issue.py daily

      - name: Commit Daily update
        run: |
          git config user.name "hayden-academy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily automation/status.json
          git diff --cached --quiet || git commit -m "auto: update daily issue"
          git push
