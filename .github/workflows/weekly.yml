name: HAYDEN ACADEMY · Weekly
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'
permissions:
  contents: write
jobs:
  update-weekly:
    runs-on: ubuntu-latest
    steps:
